# Covers CI actions, Ruby build tooling, and Git submodule revisions.
# Swift dependencies are declared in Xcode projects, without a Package.swift;
# they and the Carthage dependencies still require separate maintenance.
# Dependencies inside submodules must be maintained in their own repositories.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Gemfile and Gemfile.lock provide Fastlane and its dependencies for CI.
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      ruby-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep submodule updates separate so each revision can be reviewed on its own.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
