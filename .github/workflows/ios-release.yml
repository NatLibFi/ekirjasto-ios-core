name: ios-release

#
# This workflow runs when a GitHub Release is published.
#

on:
  release:
    types: [published]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ios-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  COMMIT_SHA: ${{ github.sha }}
  BRANCH_NAME: ${{ github.event.release.target_commitish }}
  TARGET_BRANCH_NAME: ${{ github.event.release.target_commitish }}

  # Join all secrets, so that they're "used", and will be masked in logs
  MASKED_SECRETS: ${{ join(secrets, '\n') }}

jobs:
  build:
    name: Build and publish iOS release
    runs-on: macOS-26

    steps:
      - name: Validate release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo \
              "Release tag must match vX.Y.Z. Got: ${RELEASE_TAG}" >&2
            exit 1
          fi

          EXPECTED_TARGET="release/${RELEASE_TAG}"

          if [[ "${RELEASE_TARGET}" != "${EXPECTED_TARGET}" ]]; then
            echo \
              "Release target must be ${EXPECTED_TARGET}. Got: ${RELEASE_TARGET}" >&2
            exit 1
          fi

      - name: Checkout released version
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          TAG_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"

          if [[ "${TAG_SHA}" != "${CHECKED_OUT_SHA}" ]]; then
            echo "Checked-out commit does not match ${RELEASE_TAG}" >&2
            exit 1
          fi

          echo "Building ${RELEASE_TAG} from ${CHECKED_OUT_SHA}"

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Show build info
        env:
          TEST_SECRET: ${{ secrets.MASK_TEST }}
        run: scripts/show-ci-info.sh

      - name: SSH setup for Fastlane match
        uses: MrSquaare/ssh-setup-action@v4.0.0
        with:
          private-key-name: ekirjasto-ci-ed25519
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: github.com

      - name: Force Xcode 26
        run: |
          sudo xcode-select \
            -switch /Applications/Xcode_26.2.app

      - name: Bootstrap
        env:
          EKIRJASTO_FASTLANE_APP_STORE_CONNECT_API_KEY_JSON_BASE64: ${{ secrets.FASTLANE_APP_STORE_CONNECT_API_KEY_JSON }}
          EKIRJASTO_IOS_TRANSIFEX_TOKEN: ${{ secrets.TRANSIFEX_TOKEN }}
          EKIRJASTO_LIBLCP_DEPENDENCY_SECRET: ${{ secrets.LIBLCP_DEPENDENCY_SECRET }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/bootstrap.sh --overwrite-secrets

      - name: App version and build number consistency check
        run: scripts/version.sh --check

      - name: Upload and download Transifex localizations
        env:
          EKIRJASTO_IOS_TRANSIFEX_SECRET: ${{ secrets.TRANSIFEX_SECRET }}
          EKIRJASTO_IOS_TRANSIFEX_TOKEN: ${{ secrets.TRANSIFEX_TOKEN }}
        run: scripts/transifex.sh --append-tags=release

      - name: Build debug build
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: scripts/build.sh debug

      - name: Run tests
        if: ${{ !cancelled() }}
        run: scripts/run-tests.sh

      - name: Run release checks
        env:
          EKIRJASTO_IOS_TRANSIFEX_SECRET: ${{ secrets.TRANSIFEX_SECRET }}
          EKIRJASTO_IOS_TRANSIFEX_TOKEN: ${{ secrets.TRANSIFEX_TOKEN }}
        run: scripts/release-checks.sh

      - name: Build and upload production release to TestFlight
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: scripts/build.sh release_upload config:production

      - name: Build and upload beta release to TestFlight
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: scripts/build.sh release_upload config:beta

      - name: Build and upload dev release to TestFlight
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: scripts/build.sh release_upload config:dev

      - name: Mark PRs as released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          RELEASE_LABEL="release:${RELEASE_TAG}"

          if ! gh label list \
            --limit 1000 \
            --json name \
            --jq '.[].name' |
            grep -Fxq "released"
          then
            echo "Creating label released"

            gh label create "released" \
              --color "0E8A16" \
              --description "Included in a published release"
          fi

          gh pr list \
            --state merged \
            --label "${RELEASE_LABEL}" \
            --limit 100 \
            --json number,title \
            --jq '
              .[]
              | [.number, .title]
              | @tsv
            ' \
            > released-prs.txt

          if [[ ! -s released-prs.txt ]]; then
            echo \
              "No PRs found with label ${RELEASE_LABEL}" >&2
            exit 1
          fi

          while IFS=$'\t' read -r pr title
          do
            echo "Marking PR #${pr} as released: ${title}"

            gh pr edit "${pr}" \
              --add-label "released"
          done < released-prs.txt
